<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>YouIndie — платформа инди-разработчиков</title>
	<meta name="description" content="YouIndie перезапускается: новое сообщество инди-разработчиков — проекты и девлоги, биржа вакансий, ассеты и форум. Скоро.">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #0B0F19;
			--card: #111827;
			--cyan: #00F0F0;
			--pink: #F00073;
			--text: #E2E8F0;
			--muted: #94A3B8;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				radial-gradient(600px 400px at 15% 10%, rgba(0, 240, 240, 0.07), transparent 60%),
				radial-gradient(700px 500px at 85% 90%, rgba(240, 0, 115, 0.07), transparent 60%),
				var(--bg);
			color: var(--text);
			font-family: Inter, sans-serif;
			padding: 24px;
		}
		.card {
			max-width: 620px;
			width: 100%;
			text-align: center;
			background: var(--card);
			border: 1px solid rgba(0, 240, 240, 0.18);
			border-radius: 20px;
			padding: 56px 44px;
			box-shadow: 0 0 90px rgba(0, 240, 240, 0.07), 0 0 40px rgba(240, 0, 115, 0.05);
		}
		.logo {
			font-family: Rajdhani, sans-serif;
			font-weight: 700;
			font-size: 2.6rem;
			letter-spacing: 0.04em;
			color: #fff;
		}
		.logo .indie { color: var(--cyan); text-shadow: 0 0 18px rgba(0, 240, 240, 0.45); }
		.logo .ru { color: var(--pink); font-size: 1.2rem; vertical-align: super; }
		.tagline {
			margin-top: 6px;
			font-family: Rajdhani, sans-serif;
			font-size: 0.95rem;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			color: var(--muted);
		}
		h1 {
			margin-top: 40px;
			font-family: Rajdhani, sans-serif;
			font-weight: 700;
			font-size: 2rem;
			color: #fff;
		}
		.lead {
			margin-top: 16px;
			font-size: 1.02rem;
			line-height: 1.7;
			color: var(--muted);
		}
		.lead b { color: var(--text); font-weight: 600; }
		.status {
			margin-top: 36px;
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 10px 20px;
			border: 1px solid rgba(0, 240, 240, 0.35);
			border-radius: 999px;
			font-family: Rajdhani, sans-serif;
			font-weight: 600;
			letter-spacing: 0.08em;
			color: var(--cyan);
			background: rgba(0, 240, 240, 0.05);
		}
		.dot {
			width: 9px;
			height: 9px;
			border-radius: 50%;
			background: var(--cyan);
			box-shadow: 0 0 10px rgba(0, 240, 240, 0.9);
			animation: pulse 1.6s ease-in-out infinite;
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; transform: scale(1); }
			50% { opacity: 0.45; transform: scale(0.8); }
		}
		footer {
			margin-top: 36px;
			font-size: 0.82rem;
			color: #64748B;
		}
		@media (max-width: 480px) {
			.card { padding: 40px 24px; }
			.logo { font-size: 2.1rem; }
			h1 { font-size: 1.6rem; }
		}
	</style>
</head>
<body>
	<main class="card">
		<div class="logo">You<span class="indie">Indie</span><span class="ru">.ru</span></div>
		<div class="tagline">Платформа инди-разработчиков</div>
		<h1>Мы перезапускаемся</h1>
		<p class="lead">
			Строим новую площадку для инди-команд и соло-разработчиков:
			<b>проекты и девлоги</b>, <b>биржа вакансий</b>, <b>ассеты</b> и <b>форум</b>.
			Старая версия сайта снята — совсем скоро здесь откроется новая.
		</p>
		<div class="status"><span class="dot"></span>Работы идут — запуск скоро</div>
		<footer>© 2026 YouIndie</footer>
	</main>
</body>
</html>
